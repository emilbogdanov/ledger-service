[project]
name = "ledger"
version = "0.1.0.dev0"
description = "Double-entry ledger API: accounts per currency, balanced journal entries, idempotent transfers."
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Emil Bogdanov" }]
dependencies = [
    "alembic>=1.20",
    "asyncpg>=0.32",
    "fastapi>=0.143",
    "pydantic-settings>=2.16",
    "redis>=8.1",
    "sqlalchemy[asyncio]>=2.1",
    "uvicorn>=0.54",
]

[project.scripts]
ledger = "ledger.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "hypothesis>=6.170",
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17.1",
    "testcontainers[postgres,redis]>=4.15",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH",
    "PL", "RUF", "S", "T20", "DTZ", "PT", "TRY", "ERA", "FBT", "ARG", "PIE", "TC",
]
ignore = [
    "TRY003",   # exception messages are composed in the exception classes where it matters
    "PLR0913",  # keyword-only constructors for entities legitimately take many fields
]

[tool.ruff.lint.per-file-ignores]
# asserts, fake credentials, literal expectations, tests that request many fixtures,
# seeded randomness for test data
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PLR0917", "S311"]

[tool.mypy]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations"]
mypy_path = "src"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = [
    "error",
    # docker-py warns when a credential helper named in ~/.docker/config.json isn't on PATH;
    # that is about the machine, not this code, so show it without failing the run.
    "default:docker-credential-:UserWarning",
]
